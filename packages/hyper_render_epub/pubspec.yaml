name: hyper_render_epub
description: EPUB container support for HyperRender. Unzips an .epub, parses its OPF manifest/spine/TOC, and resolves chapters to HyperViewer-ready content.
version: 0.1.0
homepage: https://github.com/brewkits/hyper_render
repository: https://github.com/brewkits/hyper_render/tree/main/packages/hyper_render_epub
issue_tracker: https://github.com/brewkits/hyper_render/issues

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

topics:
  - flutter
  - epub
  - ebook-reader

dependencies:
  flutter:
    sdk: flutter
  # Version dep so pana/pub.dev can resolve without local path.
  # The dependency_overrides below point to the local monorepo copy during dev.
  hyper_render_core: ^1.6.0

dependency_overrides:
  hyper_render_core:
    path: ../hyper_render_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
